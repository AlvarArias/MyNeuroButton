name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -v
      - name: Run tests
        run: swift test -v

  build-platforms:
    name: Build (${{ matrix.name }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS
            sdk: iphonesimulator
            device: iPhone
          - name: tvOS
            sdk: appletvsimulator
            device: Apple TV
    steps:
      - uses: actions/checkout@v4
      - name: Build package for ${{ matrix.name }}
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available | grep -m1 "${{ matrix.device }}" | sed -E 's/^ *(.*) \([0-9A-F-]{36}\).*/\1/')
          echo "Using simulator: $DEVICE"
          PLATFORM=$([ "${{ matrix.name }}" = tvOS ] && echo "tvOS Simulator" || echo "iOS Simulator")
          xcodebuild build \
            -scheme MyNeuroUI-Package \
            -destination "platform=$PLATFORM,name=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO
